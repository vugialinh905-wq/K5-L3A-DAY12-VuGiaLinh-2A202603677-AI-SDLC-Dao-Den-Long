<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đảo Đèn Lồng</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0614; font-family: system-ui, sans-serif; color: #ffe2b0; }
  canvas { display: block; }
  #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 18px; flex-wrap: wrap; font-size: 18px; text-shadow: 0 1px 4px #000; pointer-events: none; }
  #hud div { background: rgba(20, 8, 40, .55); padding: 6px 12px; border-radius: 10px; border: 1px solid rgba(255, 170, 70, .35); }
  #help { position: fixed; bottom: 12px; left: 12px; font-size: 13px; opacity: .8; background: rgba(20, 8, 40, .55); padding: 6px 12px; border-radius: 10px; }
  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(10, 4, 20, .72); text-align: center; }
  #msg h1 { font-size: 44px; margin: 0 0 8px; color: #ffb347; }
  #msg p { font-size: 20px; margin: 4px; }
</style>
</head>
<body>
<div id="hud">
  <div id="flames"></div><div id="carried"></div><div id="lanterns"></div><div id="time"></div><div id="score"></div>
</div>
<div id="help">WASD đi · Space nhảy · E nạp ánh sáng vào đèn · F tỏa sáng · ←/→ hoặc Z/C xoay camera · R chơi lại</div>
<div id="msg"><h1 id="msgTitle"></h1><p id="msgBody"></p><p>Nhấn R để chơi lại</p></div>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
